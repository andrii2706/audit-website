# Installed by scripts/server/setup.sh as /etc/nginx/conf.d/bp-audit-http.conf (http context, shared by all sites).
# See docs/SECURITY.md → "Server".

# Don't print the nginx version on error pages and in the Server header.
server_tokens off;

# Rate limits (per visitor IP). 429 = "Too Many Requests".
limit_req_status 429;
# CMS admin login: 10 attempts per minute (Strapi adds its own 5-per-5-minutes limit per account).
limit_req_zone $binary_remote_addr zone=bp_admin_login:10m rate=10r/m;
# Website pages: 5 per second per IP with a generous burst — people never notice it, bulk downloaders hit 429.
limit_req_zone $binary_remote_addr zone=bp_site_get:10m rate=5r/s;
# Website POST requests (the lead form): 10 per minute. GET requests are not limited (empty key).
map $request_method $bp_post_key {
  POST    $binary_remote_addr;
  default "";
}
limit_req_zone $bp_post_key zone=bp_site_post:10m rate=10r/m;

# Slow-client protection.
client_body_timeout 15s;
client_header_timeout 15s;
send_timeout 30s;
